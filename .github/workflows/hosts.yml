name: Verify hosts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover hosts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - id: hosts
        name: Create host matrix
        shell: bash
        run: |
          set -euo pipefail
          darwin=$(nix eval --no-write-lock-file --json .#darwinConfigurations --apply builtins.attrNames)
          nixos=$(nix eval --no-write-lock-file --json .#nixosConfigurations --apply builtins.attrNames)
          matrix=$(jq -cn --argjson darwin "$darwin" --argjson nixos "$nixos" '
            {include:
              ([$darwin[] | {host: ., configuration: "darwinConfigurations", runner: "macos-15"}] +
               [$nixos[] | {host: ., configuration: "nixosConfigurations", runner: "ubuntu-latest"}])
            }
          ')
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "No host configurations found" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.host }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build system configuration
        env:
          HOST: ${{ matrix.host }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: nix build --no-link --no-write-lock-file ".#${CONFIGURATION}.${HOST}.config.system.build.toplevel"

  verified:
    name: Verify all hosts
    if: always()
    needs: [discover, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check host build results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$DISCOVER_RESULT" = success
          test "$BUILD_RESULT" = success
